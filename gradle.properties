# Multiple Minecraft targets retain mapping and dependency data in the daemon.
org.gradle.jvmargs=-Xmx4G
# Build version projects sequentially and bound worker concurrency to limit peak memory.
org.gradle.parallel=false
org.gradle.workers.max=2
# The multi-version preprocessor retains Project objects, including through IDE models.
# Disable configuration caching until the preprocessor supports serialization.
org.gradle.configuration-cache=false

# Default Minecraft target for common and NeoForge
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)

# Fabric Properties
# check these on https://fabricmc.net/develop
loader_version=0.20.1
loom_version=1.19.4
preprocessor_version=c5abb4fb12

# NeoForge Properties
moddev_version=2.0.148
neoforge_version=26.3.0.26-beta
neoforge_version_range=[26.3.0.26-beta,26.4)

# Common compile-only Mixin APIs
mixin_version=0.17.4+mixin.0.8.7
mixinextras_version=0.5.5

# Mod Properties
version=1.0.0
group=io.github.piscescup.mc.clear_f3

# Fabric API versions are configured in fabric/versions/<version>/gradle.properties.
