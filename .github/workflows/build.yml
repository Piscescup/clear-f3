name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Empty = all; or fabric, neoforge, fabric:1.20.1 (comma-separated)'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      targets:
        type: string
        required: false
        default: ''
      source_ref:
        description: 'Commit or ref to build; defaults to the triggering commit'
        type: string
        required: false
        default: ''
    outputs:
      artifact_id:
        description: 'Artifact containing installable JARs grouped by loader'
        value: ${{ jobs.gather.outputs.artifact_id }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.source_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Prepare build targets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Check CI helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Read enabled targets
        id: matrix
        env:
          TARGETS: ${{ inputs.targets }}
        run: python3 .github/scripts/ci.py matrix --targets "$TARGETS"

  build:
    name: ${{ matrix.loader }} / Minecraft ${{ matrix.minecraft }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the prepared commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Install Java 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Validate wrapper and configure Gradle caching
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch }}
      - name: Register both Java toolchains
        run: |
          ci_gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$ci_gradle_home"
          printf '%s\n' 'org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64' >> "$ci_gradle_home/gradle.properties"
      - name: Build and run configured checks
        env:
          BUILD_TASK: ${{ matrix.task }}
          BUILD_COMMON: ${{ matrix.common }}
        run: |
          chmod +x ./gradlew
          if [ "$BUILD_COMMON" = "true" ]; then
            ./gradlew --no-daemon --stacktrace :common:build "$BUILD_TASK"
          else
            ./gradlew --no-daemon --stacktrace "$BUILD_TASK"
          fi
      - name: Collect the installable JAR
        id: collect
        env:
          MOD_LOADER: ${{ matrix.loader }}
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
        run: python3 .github/scripts/ci.py collect --loader "$MOD_LOADER" --minecraft "$MINECRAFT_VERSION"
      - name: Upload target JAR
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          compression-level: 0
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.artifact }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  gather:
    name: Gather installable JARs
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the prepared commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Download target JARs
        uses: actions/download-artifact@v8
        with:
          pattern: clear-f3-target-*
          path: build/targets
      - name: Verify and gather selected targets
        env:
          TARGETS: ${{ inputs.targets }}
        run: python3 .github/scripts/ci.py gather --targets "$TARGETS"
      - name: Upload mod download bundle
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: clear-f3-mod-jars
          path: build/releases/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
          compression-level: 0
